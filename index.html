<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="K&amp;S Grundwerk · 小老鼠营造社：小说场景户型图编辑器。网格房间、门窗、家具符号、人物与事件标记、粉笔轮廓与血迹，两种画风，PNG / SVG 导出。">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>K&amp;S Grundwerk</title>
<style>
:root{
  --bg:#E7E5DF; --panel:#F3F2ED; --stage:#D9D7CF; --ink:#14151A; --mut:#62646E;
  --rule:#14151A; --soft:#C9C7BE; --field:#FFFFFF; --shadow:#14151A;
  --red:#E5341F; --yel:#F5B916; --blu:#2450DB; --grid:rgba(20,21,26,.09);
  --ui:"Jost","Noto Sans SC",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"DM Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0D11; --panel:#14161C; --stage:#08090C; --ink:#ECE9E1; --mut:#8D909B;
    --rule:#ECE9E1; --soft:#2A2D38; --field:#0C0D11; --shadow:#000;
    --blu:#4B74FF; --grid:rgba(236,233,225,.07);
  }
}
:root[data-theme="dark"]{
  --bg:#0C0D11; --panel:#14161C; --stage:#08090C; --ink:#ECE9E1; --mut:#8D909B;
  --rule:#ECE9E1; --soft:#2A2D38; --field:#0C0D11; --shadow:#000;
  --blu:#4B74FF; --grid:rgba(236,233,225,.07);
}
*{box-sizing:border-box}
html,body{height:100%}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:14px/1.45 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;padding:10px 16px;border-bottom:3px solid var(--rule);background:var(--panel)}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:58px;height:35px;flex:none;display:block}
.brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:.1em;line-height:1;text-transform:uppercase}
.brand h1 span{color:var(--red)}
.brand h1 small{display:block;margin-top:5px;font-size:11px;font-weight:500;letter-spacing:.2em;color:var(--mut)}
.readout{display:flex;flex-wrap:wrap;gap:4px 18px;font:12px/1.3 var(--mono);color:var(--mut);font-variant-numeric:tabular-nums}
.readout b{color:var(--ink);font-weight:500}
.actions{margin-left:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{border:2px solid var(--rule);background:var(--panel);padding:5px 12px;font-weight:700;font-size:12px;letter-spacing:.08em;box-shadow:3px 3px 0 var(--shadow);transition:transform .08s,box-shadow .08s;color:var(--ink)}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--shadow)}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shadow)}
.btn.red{background:var(--red);color:#fff}
.btn.yel{background:var(--yel);color:#14151A}
.btn.blu{background:var(--blu);color:#fff}
.btn.flat{box-shadow:none;border-width:1.5px;font-weight:500;letter-spacing:0;padding:4px 9px}
.btn.flat:hover{transform:none;background:var(--ink);color:var(--panel)}
.btn.flat:active{transform:none}
.btn:disabled{opacity:.4;cursor:not-allowed}

.grid{flex:1;min-height:0;display:grid;grid-template-columns:270px minmax(0,1fr) 316px}
aside{overflow:auto;padding:0 14px 28px;background:var(--panel)}
#left{border-right:3px solid var(--rule)}
#right{border-left:3px solid var(--rule)}
.sec{padding:12px 0 14px;border-bottom:1.5px solid var(--soft);display:flex;flex-direction:column;gap:9px}
.sec:last-child{border-bottom:0}
.sec h2{margin:0;display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:.22em;text-transform:uppercase}
.sec h2 em{font-style:normal;font-weight:500;letter-spacing:.1em;color:var(--mut);font-size:11px}
.gl{width:11px;height:11px;flex:none;display:inline-block}
.gl.c{border-radius:50%;background:var(--red)}
.gl.s{background:var(--blu)}
.gl.t{width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:11px solid var(--yel)}
.gl.b{background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 4px)}
.note{font-size:12px;color:var(--mut);line-height:1.5;margin:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:2px solid var(--rule)}
.seg button{border:0;background:transparent;padding:6px 4px;font-size:12px;font-weight:500;border-right:1.5px solid var(--rule);line-height:1.25}
.seg button:last-child{border-right:0}
.seg button small{display:block;font:10px var(--mono);color:var(--mut)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.seg button[aria-pressed="true"] small{color:var(--panel);opacity:.7}
.row{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:center;gap:8px;font-size:12px}
.row>span{color:var(--mut)}
.row.r3{grid-template-columns:78px minmax(0,1fr) 40px}
.row output{font:11px var(--mono);text-align:right}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pair label,.stack label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--mut)}
.stack{display:flex;flex-direction:column;gap:8px}
input[type=number],input[type=text],select,textarea{width:100%;background:var(--field);border:1.5px solid var(--rule);padding:4px 6px;border-radius:0;font-size:13px;color:var(--ink)}
input[type=number]{font-family:var(--mono)}
textarea{resize:vertical}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--ink)}
input[type=range]::-moz-range-track{height:2px;background:var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:15px;margin-top:-7px;background:var(--yel);border:2px solid var(--rule);border-radius:0}
input[type=range]::-moz-range-thumb{width:8px;height:12px;background:var(--yel);border:2px solid var(--rule);border-radius:0}
.chk{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px}
.chk label{display:flex;gap:5px;align-items:center}
.chk input{accent-color:var(--red)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tools button{border:1.5px solid var(--rule);background:var(--field);padding:6px 2px;font-size:12px;line-height:1.2;display:flex;flex-direction:column;align-items:center;gap:3px}
.tools button svg{width:26px;height:26px;display:block}
.tools button[aria-pressed="true"]{background:var(--yel);color:#14151A}
.tools button:hover{border-color:var(--red)}
.cat{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cat button{border:1.5px solid var(--soft);background:var(--field);padding:4px 2px 3px;font-size:10px;line-height:1.1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--ink)}
.cat button canvas{width:34px;height:34px;display:block}
.cat button[aria-pressed="true"]{border-color:var(--red);background:var(--yel);color:#14151A}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chips button{border:1px solid var(--soft);background:var(--field);font-size:11px;padding:2px 7px}
.chips button:hover{background:var(--yel);color:#14151A}
.floors{display:flex;flex-wrap:wrap;gap:0;border:2px solid var(--rule)}
.floors button{border:0;border-right:1.5px solid var(--rule);background:transparent;padding:5px 10px;font-size:12px}
.floors button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.floors button.add{color:var(--mut);border-right:0}

.stage{position:relative;overflow:hidden;background:var(--stage);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:28px 28px}
.deco{position:absolute;pointer-events:none}
.deco.d1{width:300px;height:300px;border-radius:50%;background:var(--blu);right:-120px;bottom:-110px;opacity:.9}
.deco.d2{width:180px;height:180px;background:var(--red);left:-60px;top:60px;transform:rotate(18deg)}
.deco.d3{width:0;height:0;border-left:80px solid transparent;border-right:80px solid transparent;border-bottom:140px solid var(--yel);right:120px;top:-30px;transform:rotate(160deg)}
.sbar{position:absolute;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:3;font:12px var(--mono);background:color-mix(in srgb,var(--stage) 84%,transparent);border-bottom:1.5px solid var(--soft)}
.sbar .sp{flex:1}
.sbar .hint{color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#cv{position:absolute;inset:40px 0 0 0;width:100%;height:calc(100% - 40px);display:block;touch-action:none;z-index:2;cursor:crosshair}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--ink);color:var(--panel);padding:9px 16px;font-size:13px;border:2px solid var(--yel);box-shadow:4px 4px 0 var(--red);max-width:calc(100% - 32px)}

@media (max-width:1100px){
  html,body{height:auto}
  body{min-height:100%}
  .grid{display:flex;flex-direction:column}
  .stage{order:-1;height:62vh;min-height:360px;border-bottom:3px solid var(--rule)}
  aside{overflow:visible}
  #left,#right{border:0}
  #left{border-bottom:3px solid var(--rule)}
  .actions{margin-left:0}
  .sbar .hint{display:none}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style>

<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 60 36" aria-hidden="true"><path d="M44 27 C54 27 57 19 51 15 S47 5 56 4" fill="none" stroke="var(--ink)" stroke-width="2.6" stroke-linecap="round"/><path d="M2 27 L44 6 L44 27 Z" fill="var(--yel)"/><rect x="34" y="27" width="10" height="5" fill="var(--blu)"/><circle cx="33" cy="9" r="7.5" fill="var(--red)"/><circle cx="18" cy="22" r="1.9" fill="var(--ink)"/></svg>
    <h1>Kirkland <span>&amp;</span> Sunshine<small>小老鼠营造社 · K&amp;S GRUNDWERK</small></h1>
  </div>
  <div class="readout" id="readout" aria-live="polite"></div>
  <div class="actions">
    <button class="btn flat" id="btnUndo" title="Ctrl+Z">撤销</button>
    <button class="btn flat" id="btnRedo" title="Ctrl+Shift+Z">重做</button>
    <button class="btn flat" id="btnPreview" aria-pressed="false">版面预览</button>
    <button class="btn blu" id="btnSvg">导出 SVG</button>
    <button class="btn yel" id="btnPng">导出 PNG</button>
  </div>
</header>

<main class="grid">
  <aside id="left" aria-label="工具">
    <section class="sec">
      <h2><i class="gl c"></i>工具 <em id="toolHint"></em></h2>
      <div class="tools" id="tools">
        <button data-t="select" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 3l14 9-6 1.5L10 20z"/></svg>选择</button>
        <button data-t="hand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 12V6a1.5 1.5 0 013 0v5M11 11V4.5a1.5 1.5 0 013 0V11M14 11V6a1.5 1.5 0 013 0v8.5a5 5 0 01-10 0V9a1.5 1.5 0 013 0"/></svg>平移</button>
        <button data-t="room"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><rect x="4" y="5" width="16" height="14"/><path d="M12 5v14M4 12h8"/></svg>房间</button>
        <button data-t="door"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 18h18M7 18V8M7 8a10 10 0 0110 10"/></svg>门</button>
        <button data-t="window"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10h18M3 14h18M6 8v8M18 8v8"/></svg>窗</button>
        <button data-t="text"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M12 6v13M9 19h6"/></svg>文字</button>
        <button data-t="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg>标记</button>
        <button data-t="path"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-dasharray="3 2"><path d="M4 18c4-1 3-9 8-9s4 7 8-3"/><path d="M17 5l3 1-1 3" stroke-dasharray="0"/></svg>动线</button>
        <button data-t="char"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/></svg>人物</button>
        <button data-t="outline"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="2.5 1.5"><circle cx="6" cy="12" r="2.5"/><path d="M8.5 11h7l4-4M15.5 13l4 4M9 10l2-5M9 14l2 5"/></svg>轮廓</button>
        <button data-t="blood"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="13" r="4"/><circle cx="15" cy="9" r="2"/><circle cx="16" cy="15" r="1.3"/><circle cx="6" cy="6" r="1"/><circle cx="18" cy="19" r=".9"/></svg>血迹</button>
        <button data-t="delete"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M9 7V4h6v3M7 7l1 13h8l1-13M10 11v6M14 11v6"/></svg>删除</button>
      </div>
      <p class="note" id="toolNote">拖出矩形画房间。房间之间共用的墙自动变薄，外墙自动变厚。</p>
    </section>

    <section class="sec">
      <h2><i class="gl t"></i>家具与结构 <em>点选后到画布上放</em></h2>
      <div class="cat" id="cat"></div>
      <p class="note">放好后可拖动，按 R 旋转，Delete 删除，Ctrl+D 复制。</p>
    </section>

    <section class="sec">
      <h2><i class="gl b"></i>工程</h2>
      <div class="chips">
        <button id="btnSave">保存工程 .json</button>
        <button id="btnLoad">载入工程</button>
        <button id="btnSample">恢复示例</button>
        <button id="btnNew">新建空白</button>
      </div>
      <input type="file" id="fileJson" accept=".json,application/json" hidden>
      <p class="note">工程自动存在这台浏览器里。换电脑或长期保存，请导出 .json。</p>
    </section>
  </aside>

  <section class="stage" id="stage" aria-label="画布">
    <i class="deco d1"></i><i class="deco d2"></i><i class="deco d3"></i>
    <div class="sbar">
      <button class="btn flat" id="zOut" aria-label="缩小">−</button>
      <span id="zVal" style="min-width:44px;text-align:center">100%</span>
      <button class="btn flat" id="zIn" aria-label="放大">＋</button>
      <button class="btn flat" id="zFit">适应</button>
      <span class="sp"></span>
      <span class="hint" id="hint">滚轮缩放 · 空格+拖动平移 · 双击房间改名</span>
    </div>
    <canvas id="cv"></canvas>
  </section>

  <aside id="right" aria-label="属性与版面">
    <section class="sec">
      <h2><i class="gl s"></i>楼层</h2>
      <div class="floors" id="floors"></div>
      <div class="pair">
        <label for="flName">本层名称<input type="text" id="flName"></label>
        <label>操作<div class="chips"><button id="flRename">改名</button><button id="flDel">删除本层</button></div></label>
      </div>
    </section>
    <div id="props"></div>
    <section class="sec">
      <h2><i class="gl c"></i>画风</h2>
      <div class="seg" data-seg="style"><button data-v="draft">建筑图纸<small>Grundriss</small></button><button data-v="hand">旧手稿<small>Manuskript</small></button></div>
      <div class="chk">
        <label for="showArea"><input type="checkbox" id="showArea" data-s="showArea"> 显示面积</label>
        <label for="numbering"><input type="checkbox" id="numbering" data-s="numbering"> 房间编号</label>
        <label for="showGrid"><input type="checkbox" id="showGrid" data-s="showGrid"> 编辑网格</label>
      </div>
    </section>
    <section class="sec">
      <h2><i class="gl t"></i>图签与版面</h2>
      <div class="stack">
        <label for="tName">图名<input type="text" id="tName" data-s="tName"></label>
        <div class="pair"><label for="tSub">副题 / 场景<input type="text" id="tSub" data-s="tSub"></label><label for="tAuthor">作者<input type="text" id="tAuthor" data-s="tAuthor"></label></div>
      </div>
      <label class="row" for="sheet"><span>页面</span><select id="sheet" data-s="sheet"><option value="A5">A5 148 × 210</option><option value="B5">B5 176 × 250</option><option value="A6">A6 105 × 148</option><option value="B6">B6 125 × 176</option><option value="A5h">A5 半页 148 × 105</option><option value="B5h">B5 半页 176 × 125</option><option value="A4">A4 210 × 297</option><option value="fit">紧贴图形</option></select></label>
      <div class="pair">
        <label for="orient">方向<select id="orient" data-s="orient"><option value="auto">自动</option><option value="p">竖</option><option value="l">横</option></select></label>
        <label for="margin">页边距 mm<input type="number" id="margin" data-s="margin" data-n="1" min="4" max="30" step="1"></label>
      </div>
      <label class="row" for="scaleMode"><span>比例</span><select id="scaleMode" data-s="scaleMode"><option value="auto">自动取整</option><option value="50">1:50</option><option value="75">1:75</option><option value="100">1:100</option><option value="150">1:150</option><option value="200">1:200</option></select></label>
      <label class="row r3" for="north"><span>指北针</span><input type="range" id="north" data-s="north" data-n="1" min="-180" max="180" step="5"><output id="northOut"></output></label>
      <div class="chk">
        <label for="legend"><input type="checkbox" id="legend" data-s="legend"> 图例</label>
        <label for="scalebar"><input type="checkbox" id="scalebar" data-s="scalebar"> 比例尺</label>
        <label for="frame"><input type="checkbox" id="frame" data-s="frame"> 图框</label>
      </div>
      <label class="row" for="dpi"><span>PNG</span><select id="dpi"><option>150</option><option selected>300</option><option>600</option></select></label>
      <p class="note">SVG 是矢量，可以直接放进 Pulpwerk 的插图页或任何排版软件。PNG 为透明底外的白底。</p>
    </section>
  </aside>
</main>
<div class="toast" id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r2=v=>Math.round(v*100)/100;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS='ks-grundwerk-v1';
const SHEETS={A5:[148,210],B5:[176,250],A6:[105,148],B6:[125,176],A5h:[148,105],B5h:[176,125],A4:[210,297]};
const NICE=[20,25,30,40,50,60,75,100,125,150,200,250,300,400,500,750,1000];
const CIRC='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳';
const circ=n=>n>=1&&n<=20?CIRC[n-1]:'('+n+')';
const T_EXT=0.24,T_INT=0.12;

/* fonts */
['Jost:wght@400;500;700;800','DM+Mono:wght@400;500','Noto+Sans+SC:wght@400;700','LXGW+WenKai+TC:wght@400;700'].forEach(f=>{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f+'&display=swap';document.head.appendChild(l);});
if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',()=>req());
const FONT={draft:'"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',hand:'"LXGW WenKai TC","KaiTi","STKaiti","Noto Sans SC",serif'};

/* ================= hashing / noise ================= */
function h32(a,b,c){let h=(a*374761393+b*668265263+c*2147483647)|0;h=(h^(h>>>13))*1274126177;h^=h>>>16;return (h>>>0)/4294967296;}
function rng(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s^=s>>>17;s^=s<<5;return (s>>>0)/4294967296;};}

/* ================= renderer ================= */
/* world units: metres. widths and text sizes: paper millimetres. */
class Base{
  constructor(o){this.k=o.k;this.pmm=o.pmm;this.ox=o.ox;this.oy=o.oy;this.hand=!!o.hand;this.denom=o.denom;this.font=this.hand?FONT.hand:FONT.draft;}
  X(x){return this.ox+x*this.k}Y(y){return this.oy+y*this.k}

function bounds(objs){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;const add=(x,y)=>{x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x);y1=Math.max(y1,y);};

function inRoom(x,y){return rooms().some(r=>x>r.x+0.001&&x<r.x+r.w-0.001&&y>r.y+0.001&&y<r.y+r.h-0.001);}
/* edges of a room: [{o:'h'|'v', a:fixed coord, s:start, e:end, out:sign outward}] */
function edges(r){return [{o:'h',a:r.y,s:r.x,e:r.x+r.w,out:-1,r},{o:'h',a:r.y+r.h,s:r.x,e:r.x+r.w,out:1,r},{o:'v',a:r.x,s:r.y,e:r.y+r.h,out:-1,r},{o:'v',a:r.x+r.w,s:r.y,e:r.y+r.h,out:1,r}];}

  const rs=rooms(),cuts=new Set([ed.s,ed.e]);
  rs.forEach(r=>{if(r===ed.r)return;const c=ed.o==='h'?[r.x,r.x+r.w]:[r.y,r.y+r.h];c.forEach(v=>{if(v>ed.s+1e-6&&v<ed.e-1e-6)cuts.add(v);});});
  const cs=[...cuts].sort((a,b)=>a-b),segs=[];

  return segs;
}
function nearestEdge(x,y,tol){let best=null;rooms().forEach(r=>edges(r).forEach(ed=>{const d=ed.o==='h'?Math.abs(y-ed.a):Math.abs(x-ed.a),along=ed.o==='h'?x:y;if(d<tol&&along>=ed.s-tol&&along<=ed.e+tol&&(!best||d<best.d))best={d,ed,pos:clamp(along,ed.s,ed.e)};}));return best;}
function wallT(ed,pos){return isExt(ed,pos)?T_EXT:T_INT;}
function openingEdge(op){ // resolve stored edge to current room geometry
  const r=F().objs.find(o=>o.id===op.room);if(!r)return null;
  const e=edges(r).find(e=>e.o===op.o&&e.out===op.out);return e||null;

function sheetSpec(fl){

function objBox(o){
  if(o.t==='room')return {x0:o.x,y0:o.y,x1:o.x+o.w,y1:o.y+o.h};
  if(o.t==='path'){const b=bounds([o]);return b;}
  if(o.t==='text'){const w=(o.text||'').length*(o.size||3)*curDenom/1000*0.9;return {x0:o.x-w/2,y0:o.y-0.2,x1:o.x+w/2,y1:o.y+0.2};}
  if(o.t==='mark'||o.t==='char'){const r=0.35*curDenom/100;return {x0:o.x-r,y0:o.y-r,x1:o.x+r+(o.label||o.name?1.2:0),y1:o.y+r};}
  if(o.t==='open'){const ed=openingEdge(o);if(!ed)return {x0:o.x||0,y0:o.y||0,x1:o.x||0,y1:o.y||0};const [x,y]=ed.o==='h'?[o.pos,ed.a]:[ed.a,o.pos];return ed.o==='h'?{x0:x-o.len/2,y0:y-0.2,x1:x+o.len/2,y1:y+0.2}:{x0:x-0.2,y0:y-o.len/2,x1:x+0.2,y1:y+o.len/2};}
  if(o.t==='blood'){const r=(o.size||0.6)*(o.kind==='smear'||o.kind==='prints'?2.4:o.kind==='spatter'?1.9:1.1);return {x0:o.x-r,y0:o.y-r,x1:o.x+r,y1:o.y+r};}
  if(o.t==='outline'){const s=(o.scale||1);return {x0:o.x-0.7*s,y0:o.y-0.95*s,x1:o.x+0.7*s,y1:o.y+0.95*s};}
  const a=(o.rot||0)*Math.PI/180,c=Math.abs(Math.cos(a)),s=Math.abs(Math.sin(a)),hw=(o.w*c+o.h*s)/2,hh=(o.w*s+o.h*c)/2;return {x0:o.x-hw,y0:o.y-hh,x1:o.x+hw,y1:o.y+hh};
}
function hit(x,y){
  const objs=F().objs.slice().sort((a,b)=>ZORD[b.t]-ZORD[a.t]),tol=6/view.k;
  for(const o of objs){
    if(o.t==='room')continue;
    if(o.t==='path'){for(let i=0;i<o.pts.length-1;i++)if(distSeg(x,y,o.pts[i],o.pts[i+1])<tol)return o;continue;}
    const b=objBox(o);if(x>=b.x0-tol&&x<=b.x1+tol&&y>=b.y0-tol&&y<=b.y1+tol)return o;
  }
  const rs=objs.filter(o=>o.t==='room').sort((a,b)=>a.w*a.h-b.w*b.h);
  for(const r of rs)if(x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h)return r;
  return null;
}
function distSeg(px,py,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1e-9,t=clamp(((px-a[0])*dx+(py-a[1])*dy)/L,0,1);return Math.hypot(px-a[0]-dx*t,py-a[1]-dy*t);}
const selObj=()=>F().objs.find(o=>o.id===sel)||null;

cv.addEventListener('pointerdown',e=>{

    const op={id:nid(),t:'open',kind:tool==='door'?'door':'window',room:ne.ed.r.id,o:ne.ed.o,out:ne.ed.out,pos:snap(ne.pos,0.05),len:tool==='door'?0.9:1.2,side:-ne.ed.out,hinge:1};

  /* select */
  const s=selObj();
  if(s&&s.t==='room'){const hs=[[s.x,s.y,'nw'],[s.x+s.w,s.y,'ne'],[s.x+s.w,s.y+s.h,'se'],[s.x,s.y+s.h,'sw']],tol=8/view.k;
    for(const h of hs)if(Math.hypot(x-h[0],y-h[1])<tol){drag={mode:'resize',o:s,c:h[2],orig:{x:s.x,y:s.y,w:s.w,h:s.h}};return;}}
  if(s&&s.t==='path'){const tol=8/view.k;for(let i=0;i<s.pts.length;i++)if(Math.hypot(x-s.pts[i][0],y-s.pts[i][1])<tol){drag={mode:'vertex',o:s,i};return;}}

  req();
});
cv.addEventListener('pointermove',e=>{
  const [x,y]=toW(e);hover=[snap(x,0.05),snap(y,0.05)];

  if(d.mode==='room'){const r=normRect(d);if(r.w>=0.5&&r.h>=0.5){const ob={id:nid(),t:'room',x:r.x,y:r.y,w:r.w,h:r.h,name:ROOM_NAMES[rooms().length%ROOM_NAMES.length],note:'',kind:'room'};F().objs.push(ob);sel=ob.id;commit();renderProps();}req();return;}

function syncPos(){const o=selObj();if(!o)return;['x','y','w','h','pos'].forEach(k=>{const e=$('p_'+k);if(e&&o[k]!=null&&document.activeElement!==e)e.value=r2(o[k]);});}
const PR=$('props');
PR.addEventListener('input',e=>{const t=e.target,k=t.dataset.k,o=selObj();if(!k||!o)return;let v=t.type==='checkbox'?t.checked:t.value;
  if(t.type==='range'||t.type==='number'){v=parseFloat(v);if(!isFinite(v))return;if(t.min!=='')v=Math.max(+t.min,v);}
  o[k]=v;const out=t.parentElement.querySelector('output');if(out)out.textContent=t.value;req();});
PR.addEventListener('change',e=>{if(e.target.dataset.k){const o=selObj();if(o&&o.t==='open'&&e.target.dataset.k==='kind'){o.len=o.kind==='double'?1.6:o.kind==='window'?1.2:0.9;}commit();if(e.target.dataset.k==='kind')renderProps();}});
PR.addEventListener('click',e=>{const b=e.target.closest('button'),o=selObj();if(!b||!o)return;
  if(b.dataset.nm){o.name=b.dataset.nm;$('p_name').value=o.name;commit();req();return;}
  const a=b.dataset.act;
  if(a==='dup')dup();else if(a==='del')del();
  else if(a==='front'){F().objs=F().objs.filter(q=>q!==o);F().objs.push(o);commit();req();}
  else if(a==='back'){F().objs=F().objs.filter(q=>q!==o);F().objs.unshift(o);commit();req();}
  else if(a==='flipSide'){o.side=-(o.side||1);commit();req();}
  else if(a==='flipHinge'){o.hinge=-(o.hinge||1);commit();req();}
  else if(a==='rot90'){o.rot=((o.rot||0)+90)%360;commit();renderProps();req();}
  else if(a==='reset'){const c=catById(o.kind);if(c){o.w=c.w;o.h=c.h;}commit();renderProps();req();}
  else if(a==='reseed'){o.seed=Math.floor(Math.random()*99999)+1;commit();req();}
});

/* ================= history / storage ================= */
let hist=[],hi=-1,saveT=0;
function serial(){return JSON.stringify({P,cur,uid});}
function commit(){hist=hist.slice(0,hi+1);hist.push(serial());if(hist.length>80)hist.shift();hi=hist.length-1;syncUndo();save();}
function restore(s){const o=JSON.parse(s);P=o.P;cur=Math.min(o.cur,P.floors.length-1);uid=o.uid;sel=null;syncUI();renderProps();req();}
function undo(){if(hi>0){hi--;restore(hist[hi]);syncUndo();}}function redo(){if(hi<hist.length-1){hi++;restore(hist[hi]);syncUndo();}}
function syncUndo(){$('btnUndo').disabled=hi<=0;$('btnRedo').disabled=hi>=hist.length-1;}
$('btnUndo').onclick=undo;$('btnRedo').onclick=redo;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(LS,serial());}catch(_){}} ,400);}
function load(){try{const s=localStorage.getItem(LS);if(s){const o=JSON.parse(s);if(o&&o.P&&o.P.floors){P=Object.assign({},DEF,o.P);cur=Math.min(o.cur||0,P.floors.length-1);uid=o.uid||1000;return true;}}}catch(_){}return false;}
let toastT=0;function toast(m,ms){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,ms||3400);}

/* ================= export ================= */
async function saveFile(name,blob){
  let dl=null;try{if(window.claude&&window.claude.use)dl=await window.claude.use('downloads');}catch(_){}
  if(dl){try{await dl.save({filename:name,data:blob});toast('已保存：'+name);}catch(err){const c=err&&err.code;toast(c==='declined'?'已取消保存':'此环境无法保存文件（'+(c||'unknown')+'）',4000);}return;}
  const a=document.createElement('a'),u=URL.createObjectURL(blob);a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('已生成：'+name);
}
const clean=t=>String(t).replace(/[^\w\u4e00-\u9fff]+/g,'_').replace(/^_+|_+$/g,'').slice(0,24)||'plan';
const fname=ext=>`KS_plan_${clean(P.tName)}_${clean(F().name)}_${P.style}.${ext}`;
$('btnPng').onclick=async()=>{const dpi=+$('dpi').value,fl=F(),sp=sheetSpec(fl),pxPerMm=dpi/25.4,c=document.createElement('canvas');c.width=Math.round(sp.W*pxPerMm);c.height=Math.round(sp.H*pxPerMm);
  if(c.width*c.height>80e6){toast('尺寸过大，请降低 DPI');return;}
  if(document.fonts&&document.fonts.load){try{await Promise.all([document.fonts.load('700 20px "Noto Sans SC"','图'),document.fonts.load('400 20px "LXGW WenKai TC"','图')]);}catch(_){}}
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);composeSheet(o=>new Canv(x,o),fl,pxPerMm);
  const b=await new Promise(r=>c.toBlob(r,'image/png'));if(b)saveFile(fname('png'),b);};
$('btnSvg').onclick=()=>{const fl=F(),sp=sheetSpec(fl),pxPerMm=1,{R}=composeSheet(o=>new Svg(o),fl,pxPerMm);
  const svg=`<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" width="${sp.W}mm" height="${sp.H}mm" viewBox="0 0 ${sp.W} ${sp.H}">\n<!-- ${esc(P.tName)} · ${esc(fl.name)} · 1:${sp.denom} · made with K&S Grundwerk -->\n<rect width="100%" height="100%" fill="#fff"/>\n${R.out.join('\n')}\n</svg>`;
  saveFile(fname('svg'),new Blob([svg],{type:'image/svg+xml'}));};
$('btnSave').onclick=()=>saveFile(fname('json').replace(/_(draft|hand)\.json$/,'.json'),new Blob([JSON.stringify({app:'ks-grundwerk',v:1,P,uid},null,1)],{type:'application/json'}));
$('btnLoad').onclick=()=>$('fileJson').click();
$('fileJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const o=JSON.parse(await f.text());if(!o.P||!o.P.floors)throw 0;P=Object.assign({},DEF,o.P);uid=o.uid||5000;cur=0;sel=null;syncUI();renderProps();commit();fit();toast('已载入 '+f.name);}catch(_){toast('不是 Grundwerk 的工程文件');}};
$('btnNew').onclick=()=>{P=Object.assign({},DEF,{floors:[newFloor('一楼')]});cur=0;sel=null;syncUI();renderProps();commit();fit();};
